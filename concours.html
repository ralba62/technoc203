<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blaise Robotics — TechnoC203</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261128070810">
<script src="assets/js/site.js?v=20261128070810"></script>
<script src="assets/js/data/concours.js?v=20261128070810"></script>
</head>
<body>
<main id="app"></main>

<script>
  const K = window.CONCOURS;
  const hasDate = !!K.dateFinale;

  U.$("#app").innerHTML = `
    <section class="contest-hero">
      <div>
        <span class="eyebrow">Concours de robotique · ${U.esc(K.edition)}</span>
        <h1>Blaise <span class="grad">Robotics</span></h1>
        <p style="font-size:18.5px">${U.esc(K.accroche)}</p>
        ${hasDate ? `<div class="countdown" id="cd" aria-label="Compte à rebours avant la finale"></div>
          <p style="margin-top:12px; font-size:14px; font-family:var(--f-mono)">finale · ${new Date(K.dateFinale).toLocaleDateString("fr-FR", { dateStyle:"full" })}${K.lieu && K.lieu !== "…" ? " · " + U.esc(K.lieu) : ""}</p>`
          : `<p style="margin-top:14px; font-size:14px; font-family:var(--f-mono); color:var(--energie)">● date de la finale bientôt annoncée</p>`}
        <div class="hero-actions"><a class="btn" href="#epreuves">Voir les épreuves</a><a class="btn ghost" href="${U.esc(K.siteOfficiel)}" target="_blank" rel="noopener">Site officiel ↗</a></div>
      </div>
      <div class="contest-logo"><img src="${U.esc(K.logo)}" alt="Logo du concours Blaise Robotics, lycée Blaise Pascal de Longuenesse"></div>
    </section>

    <section class="section" style="margin-top:0">
      <h2>Le concours</h2>
      <p class="lead">${U.esc(K.presentation)}</p>
    </section>

    <section class="stats" style="margin-top:22px">${K.chiffres.map(c => `<div><b>${U.esc(c.val)}</b><span>${U.esc(c.label)}</span></div>`).join("")}</section>

    <section class="section">
      <h2 id="epreuves" style="scroll-margin-top:90px">Les 4 épreuves</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr))">${K.epreuves.map((e, i) => `<article class="card hoverable" style="--c:${["var(--information)","var(--energie)","var(--t3)","var(--matiere)"][i % 4]}">
        <span class="card-num">E${i + 1}</span>
        <div class="card-icon">${U.icon(e.icone)}</div>
        <h3>${U.esc(e.nom)}</h3><p>${U.esc(e.desc)}</p>
        <ul style="margin:12px 0 0; padding-left:18px; font-size:14.5px; color:var(--muted)">${e.details.map(d => `<li>${U.esc(d)}</li>`).join("")}</ul>
        <div class="card-foot">${(e.modules || []).map(m => `<span class="tag">${U.esc(m)}</span>`).join("")}<span class="tag t2" style="margin-left:auto">${U.esc(e.prix)}</span></div>
      </article>`).join("")}</div>
      <p class="lead" style="margin-top:18px; font-size:16px">${U.esc(K.recompenses)}</p>
    </section>

    <section class="section two-col">
      <div>
        <h2>Le projet pas à pas</h2>
        <ol class="timeline">${K.calendrier.map(c => `<li><time>${U.esc(c.date)}</time><div>${U.esc(c.etape)}</div></li>`).join("")}</ol>
      </div>
      <div>
        <h2>Le jour J</h2>
        <table class="data"><tbody>${K.journee.map(j => `<tr><td style="font-family:var(--f-mono); white-space:nowrap; color:var(--accent)">${U.esc(j.h)}</td><td>${U.esc(j.t)}</td></tr>`).join("")}</tbody></table>
        <p class="count" style="margin-top:10px">${U.esc(K.journeeNote)}</p>
      </div>
    </section>

    <section class="section">
      <h2>S'entraîner : les défis de la classe</h2>
      <div class="grid">${K.defisClasse.map(d => `<article class="card" style="--c:var(--information)">
        <span class="card-num">D${d.n}</span><h3 style="padding-right:30px">${U.esc(d.titre)}</h3><p>${U.esc(d.notions)}</p></article>`).join("")}</div>
      <p class="count" style="margin-top:12px">Les fiches et corrections des défis sont sur ELEA (accès par l'ENT).</p>
    </section>

    <section class="section two-col">
      <div>
        <h2 id="reglement" style="scroll-margin-top:90px">Règlement</h2>
        ${K.reglement.map((r, i) => `<details class="rule"${i === 0 ? " open" : ""}><summary>${U.esc(r.titre)}</summary><div>${U.esc(r.texte)}</div></details>`).join("")}
        <p style="margin-top:12px">${U.linkBtn(K.reglementPdf, "Lire le règlement complet (PDF)", "btn small ghost")}</p>
        <p class="count">${U.esc(K.reglementNote)}</p>
      </div>
      <div>
        <h2>Ressources</h2>
        <div class="grid" style="grid-template-columns:1fr">
          ${K.ressources.map(r => `<a class="card" href="${U.esc(r.url)}" target="_blank" rel="noopener" style="padding:16px 20px"><h3 style="margin:0; font-size:16px">${U.esc(r.label)} ↗</h3></a>`).join("")}
          <a class="card" href="applis/decouverte-mbot.html" style="padding:16px 20px; --c:var(--t3)"><h3 style="margin:0; font-size:16px">Appli : Découverte du mBot</h3></a>
          <a class="card" href="logiciels.html" style="padding:16px 20px"><h3 style="margin:0; font-size:16px">Installer mBlock 5</h3></a>
        </div>
      </div>
    </section>

    ${K.equipes.length ? `<section class="section"><h2>Nos équipes</h2><table class="data"><thead><tr><th>Équipe</th><th>Classe</th></tr></thead><tbody>
      ${K.equipes.map(e => `<tr><td><strong>${U.esc(e.nom)}</strong></td><td>${U.esc(e.classe)}</td></tr>`).join("")}</tbody></table></section>` : ""}

    <section class="section">
      <h2>Éditions précédentes</h2>
      <ul class="news">${K.editions.map(e => `<li><time>${U.esc(e.annee)}</time><div><strong>${U.esc(e.titre)}</strong> <span style="color:var(--muted)">— ${U.esc(e.texte)}</span> <a href="${U.esc(e.url)}" target="_blank" rel="noopener">lire ↗</a></div></li>`).join("")}</ul>
    </section>`;

  // Compte à rebours
  if (hasDate){
    const end = new Date(K.dateFinale).getTime();
    const tick = () => {
      let s = Math.max(0, Math.floor((end - Date.now()) / 1000));
      const parts = [["jours", Math.floor(s / 86400)], ["heures", Math.floor(s / 3600) % 24], ["min", Math.floor(s / 60) % 60], ["s", s % 60]];
      U.$("#cd").innerHTML = s ? parts.map(([l, v]) => `<div><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`).join("") : `<div><b>C'est le jour J !</b></div>`;
    };
    tick(); setInterval(tick, 1000);
  }
</script>
</body>
</html>
